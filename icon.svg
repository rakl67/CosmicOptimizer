<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cosmic Optimizer">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1d1d1d"/>
      <stop offset="0.55" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planet" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ededed"/>
      <stop offset="0.8" stop-color="#c2c2c2"/>
      <stop offset="1" stop-color="#8f8f8f"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="20" y="20" width="472" height="472" rx="106"/>
    </clipPath>
    <clipPath id="backHalf">
      <rect x="16" y="150" width="480" height="106"/>
    </clipPath>
    <clipPath id="frontHalf">
      <rect x="16" y="256" width="480" height="112"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="106" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <circle cx="256" cy="258" r="188" fill="url(#halo)"/>

    <!-- кольцо за планетой -->
    <g transform="rotate(-19 256 256)" clip-path="url(#backHalf)">
      <ellipse cx="256" cy="256" rx="196" ry="58" fill="none" stroke="url(#ring)" stroke-width="15"/>
    </g>

    <!-- планета -->
    <circle cx="256" cy="256" r="103" fill="url(#planet)"/>
    <circle cx="256" cy="256" r="103" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6"/>

    <!-- кольцо перед планетой -->
    <g transform="rotate(-19 256 256)" clip-path="url(#frontHalf)">
      <ellipse cx="256" cy="256" rx="196" ry="58" fill="none" stroke="url(#ring)" stroke-width="17"/>
    </g>
  </g>

  <rect x="20" y="20" width="472" height="472" rx="106" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- звёзды -->
  <path d="M113 128 l3.2 10 10 3.2 -10 3.2 -3.2 10 -3.2 -10 -10 -3.2 10 -3.2z"
        fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="122" cy="378" r="2.6" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="406" cy="342" r="3.2" fill="#ffffff" fill-opacity="0.45"/>
</svg>
